name: Publish new map version

on:
  push:
    branches:
      - development

jobs:
  publish-new-map:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check whether a map is available
      id: map-available
      run: |
        if [ -s Map/map ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "No map is available in the repository template; skipping publication."
        fi
    - uses: actions/setup-node@v7.0.0
      if: steps.map-available.outputs.available == 'true'
    - name: Generate map data compatible with map reader as well as json files
      if: steps.map-available.outputs.available == 'true'
      run: |
        yarn install --frozen-lockfile
        node ./map-utilities/generate-map.mjs

    - name: Copy map file to website directory
      if: steps.map-available.outputs.available == 'true'
      run: |
        cp -R Map/ website/
    - uses: JamesIves/github-pages-deploy-action@v4.9.0
      if: steps.map-available.outputs.available == 'true'
      with:
        branch: gh-pages
        folder: website
